name: Backend build and API integration tests

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "database/**"
      - ".github/workflows/backend-test.yml"
  pull_request:
    paths:
      - "backend/**"
      - "database/**"
      - ".github/workflows/backend-test.yml"
  workflow_dispatch:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Wait for MySQL and create database
        env:
          MYSQL_PWD: root
        run: |
          for attempt in $(seq 1 30); do
            if mysql --protocol=TCP -h 127.0.0.1 -uroot -e "SELECT 1" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          mysql --protocol=TCP -h 127.0.0.1 -uroot -e "CREATE DATABASE IF NOT EXISTS internship_matching CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Compile and run unit tests
        run: mvn -B -f backend/pom.xml clean verify

      - name: Start Spring Boot with MySQL
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/internship_matching?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
          DB_USERNAME: root
          DB_PASSWORD: root
          CORS_ALLOWED_ORIGINS: http://localhost:5173
        run: |
          nohup mvn -B -f backend/pom.xml spring-boot:run > /tmp/internship-api.log 2>&1 &
          echo $! > /tmp/internship-api.pid
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8080/api/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 3
          done
          cat /tmp/internship-api.log
          exit 1

      - name: Verify API endpoints
        run: |
          curl --fail --silent http://127.0.0.1:8080/api/skills | tee /tmp/skills.json
          curl --fail --silent http://127.0.0.1:8080/api/students | tee /tmp/students.json
          curl --fail --silent http://127.0.0.1:8080/api/internships | tee /tmp/internships.json
          curl --fail --silent http://127.0.0.1:8080/api/students/1/recommendations | tee /tmp/recommendations.json

          grep -q "Java" /tmp/skills.json
          grep -q "Aarav Sharma" /tmp/students.json
          grep -q "Backend Developer Intern" /tmp/internships.json
          grep -q "matchScore" /tmp/recommendations.json

      - name: Verify application submission and duplicate protection
        run: |
          status=$(curl --silent --output /tmp/application.json --write-out "%{http_code}" \
            --request POST http://127.0.0.1:8080/api/applications \
            --header "Content-Type: application/json" \
            --data '{"studentId":1,"internshipId":1}')
          test "$status" = "201"
          grep -q "Backend Developer Intern" /tmp/application.json

          duplicate_status=$(curl --silent --output /tmp/duplicate.json --write-out "%{http_code}" \
            --request POST http://127.0.0.1:8080/api/applications \
            --header "Content-Type: application/json" \
            --data '{"studentId":1,"internshipId":1}')
          test "$duplicate_status" = "409"

          curl --fail --silent http://127.0.0.1:8080/api/students/1/applications | tee /tmp/applications.json
          grep -q "Backend Developer Intern" /tmp/applications.json

      - name: Stop Spring Boot process
        if: always()
        run: |
          if [ -f /tmp/internship-api.pid ]; then
            kill "$(cat /tmp/internship-api.pid)" || true
          fi
