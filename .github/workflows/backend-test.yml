name: Backend build and API integration tests

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "database/**"
      - ".github/workflows/backend-test.yml"
  pull_request:
    paths:
      - "backend/**"
      - "database/**"
      - ".github/workflows/backend-test.yml"
  workflow_dispatch:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Wait for MySQL and create database
        env:
          MYSQL_PWD: root
        run: |
          for attempt in $(seq 1 30); do
            if mysql --protocol=TCP -h 127.0.0.1 -uroot -e "SELECT 1" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          mysql --protocol=TCP -h 127.0.0.1 -uroot -e "CREATE DATABASE IF NOT EXISTS internship_matching CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Compile and run unit tests
        run: mvn -B -f backend/pom.xml clean verify

      - name: Start Spring Boot with MySQL
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/internship_matching?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
          DB_USERNAME: root
          DB_PASSWORD: root
          CORS_ALLOWED_ORIGINS: http://localhost:5173
          ADMIN_EMAILS: test-student@example.com
        run: |
          nohup mvn -B -f backend/pom.xml spring-boot:run > /tmp/internship-api.log 2>&1 &
          echo $! > /tmp/internship-api.pid
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8080/api/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 3
          done
          cat /tmp/internship-api.log
          exit 1

      - name: Verify public endpoints and authentication protection
        run: |
          curl --fail --silent http://127.0.0.1:8080/api/skills | tee /tmp/skills.json
          curl --fail --silent http://127.0.0.1:8080/api/internships | tee /tmp/internships.json

          grep -q "Java" /tmp/skills.json
          grep -q "Backend Developer Intern" /tmp/internships.json

          unauthenticated_status=$(curl --silent --output /tmp/unauthenticated.json --write-out "%{http_code}" http://127.0.0.1:8080/api/students)
          test "$unauthenticated_status" = "401"

          saved_unauthenticated_status=$(curl --silent --output /tmp/saved-unauthenticated.json --write-out "%{http_code}" http://127.0.0.1:8080/api/students/1/saved-internships)
          test "$saved_unauthenticated_status" = "401"

          admin_unauthenticated_status=$(curl --silent --output /tmp/admin-unauthenticated.json --write-out "%{http_code}" http://127.0.0.1:8080/api/admin/overview)
          test "$admin_unauthenticated_status" = "401"

          curl --fail --silent http://127.0.0.1:8080/api/auth/config | tee /tmp/auth-config.json
          grep -q '"googleClientId":""' /tmp/auth-config.json

          google_status=$(curl --silent --output /tmp/google-unconfigured.json --write-out "%{http_code}" \
            --request POST http://127.0.0.1:8080/api/auth/google \
            --header "Content-Type: application/json" \
            --data '{"credential":"not-a-real-token"}')
          test "$google_status" = "503"

      - name: Register, login, and verify account ownership
        run: |
          register_status=$(curl --silent --cookie-jar /tmp/student.cookies --output /tmp/registered.json --write-out "%{http_code}" \
            --request POST http://127.0.0.1:8080/api/auth/register \
            --header "Content-Type: application/json" \
            --data '{"fullName":"Test Student","email":"test-student@example.com","password":"StudentPass!234","department":"Computer Science","graduationYear":2027,"skillIds":[1,2]}')
          test "$register_status" = "201"
          grep -q "Test Student" /tmp/registered.json
          student_id=$(jq -r '.studentId' /tmp/registered.json)
          test "$student_id" != "null"

          curl --fail --silent --cookie /tmp/student.cookies http://127.0.0.1:8080/api/admin/me | jq -e '.isAdmin == true'
          curl --fail --silent --cookie /tmp/student.cookies http://127.0.0.1:8080/api/admin/overview | jq -e '.students >= 1 and .openInternships >= 1'
          internship_status=$(curl --silent --cookie /tmp/student.cookies --output /tmp/admin-internship.json --write-out "%{http_code}" \
            --request POST http://127.0.0.1:8080/api/admin/internships \
            --header "Content-Type: application/json" \
            --data '{"title":"CI Admin Test Internship","companyName":"InternMatch QA","description":"A test listing created by the admin integration workflow.","location":"Remote","workMode":"REMOTE","durationWeeks":12,"stipendAmount":18000,"applicationDeadline":"2027-03-30","status":"OPEN","requiredSkillIds":[1,2]}')
          test "$internship_status" = "201"
          admin_internship_id=$(jq -r '.internshipId' /tmp/admin-internship.json)
          test "$admin_internship_id" != "null"
          grep -q "CI Admin Test Internship" /tmp/admin-internship.json

          admin_update_status=$(curl --silent --cookie /tmp/student.cookies --output /tmp/admin-internship-updated.json --write-out "%{http_code}" \
            --request PUT "http://127.0.0.1:8080/api/admin/internships/$admin_internship_id" \
            --header "Content-Type: application/json" \
            --data '{"title":"CI Admin Test Internship Updated","companyName":"InternMatch QA","description":"Updated through the admin API.","location":"Hybrid","workMode":"HYBRID","durationWeeks":16,"stipendAmount":22000,"applicationDeadline":"2027-03-30","status":"OPEN","requiredSkillIds":[1]}')
          test "$admin_update_status" = "200"
          grep -q "CI Admin Test Internship Updated" /tmp/admin-internship-updated.json
          curl --fail --silent --cookie /tmp/student.cookies --request PATCH "http://127.0.0.1:8080/api/admin/internships/$admin_internship_id/status" \
            --header "Content-Type: application/json" --data '{"status":"CLOSED"}' | grep -q "status updated"
          curl --fail --silent --cookie /tmp/student.cookies "http://127.0.0.1:8080/api/admin/internships" | jq -e --argjson id "$admin_internship_id" 'any(.[]; .internshipId == $id and .status == "CLOSED")'

          regular_student_status=$(curl --silent --cookie-jar /tmp/regular-student.cookies --output /tmp/regular-student.json --write-out "%{http_code}" \
            --request POST http://127.0.0.1:8080/api/auth/register \
            --header "Content-Type: application/json" \
            --data '{"fullName":"Regular Student","email":"regular-student@example.com","password":"StudentPass!234","department":"Computer Science","graduationYear":2027,"skillIds":[1]}')
          test "$regular_student_status" = "201"
          regular_student_id=$(jq -r '.studentId' /tmp/regular-student.json)
          request_status=$(curl --silent --cookie /tmp.student.cookies --output /tmp/connection-request.json --write-out "%{http_code}" \
            --request POST "http://127.0.0.1:8080/api/network/$regular_student_id/request")
          test "$request_status" = "201"
          jq -e '.relationshipStatus == "OUTGOING_PENDING"' /tmp/connection-request.json
          curl --fail --silent --cookie /tmp.regular-student.cookies http://127.0.0.1:8080/api/network | jq -e '(.incomingRequests | length) == 1'
          accept_status=$(curl --silent --cookie /tmp.regular-student.cookies --output /tmp/connection-accepted.json --write-out "%{http_code}" \
            --request PATCH "http://127.0.0.1:8080/api/network/requests/$student_id/accept")
          test "$accept_status" = "200"
          jq -e '.relationshipStatus == "CONNECTED"' /tmp/connection-accepted.json
          curl --fail --silent --cookie /tmp.student.cookies http://127.0.0.1:8080/api/network | jq -e '.connectionCount == 1 and (.connections | length) == 1'

          regular_admin_status=$(curl --silent --cookie /tmp/regular-student.cookies --output /tmp/regular-admin.json --write-out "%{http_code}" http://127.0.0.1:8080/api/admin/overview)
          test "$regular_admin_status" = "403"

          curl --fail --silent --cookie /tmp/student.cookies http://127.0.0.1:8080/api/auth/me | tee /tmp/me.json
          grep -q "Test Student" /tmp/me.json

          curl --fail --silent --cookie /tmp/student.cookies "http://127.0.0.1:8080/api/students/$student_id/recommendations" | tee /tmp/recommendations.json
          grep -q "matchScore" /tmp/recommendations.json

          owner_check_status=$(curl --silent --cookie /tmp/student.cookies --output /tmp/other-student.json --write-out "%{http_code}" http://127.0.0.1:8080/api/students/1)
          test "$owner_check_status" = "403"

          curl --fail --silent --cookie /tmp/student.cookies "http://127.0.0.1:8080/api/students/$student_id/saved-internships" | tee /tmp/saved-empty.json
          jq -e 'length == 0' /tmp/saved-empty.json

          save_status=$(curl --silent --cookie /tmp/student.cookies --output /tmp/saved-response.json --write-out "%{http_code}" \
            --request POST "http://127.0.0.1:8080/api/students/$student_id/saved-internships/1")
          test "$save_status" = "200"
          grep -q '"saved":true' /tmp/saved-response.json

          curl --fail --silent --cookie /tmp/student.cookies "http://127.0.0.1:8080/api/students/$student_id/saved-internships" | tee /tmp/saved-list.json
          jq -e 'index(1) != null' /tmp/saved-list.json

          delete_status=$(curl --silent --cookie /tmp/student.cookies --output /tmp/unsaved-response.json --write-out "%{http_code}" \
            --request DELETE "http://127.0.0.1:8080/api/students/$student_id/saved-internships/1")
          test "$delete_status" = "200"
          grep -q '"saved":false' /tmp/unsaved-response.json
          curl --fail --silent --cookie /tmp/student.cookies "http://127.0.0.1:8080/api/students/$student_id/saved-internships" | jq -e 'length == 0'

          update_status=$(curl --silent --cookie /tmp/student.cookies --output /tmp/profile-updated.json --write-out "%{http_code}" \
            --request PUT "http://127.0.0.1:8080/api/students/$student_id" \
            --header "Content-Type: application/json" \
            --data '{"fullName":"Test Student Updated","department":"CSAI","graduationYear":2028,"skillIds":[1,2],"headline":"CSAI student | Java & React","about":"Building full-stack projects and learning backend engineering.","location":"Lucknow, India","linkedinUrl":"https://www.linkedin.com/in/test-student","githubUrl":"https://github.com/test-student","portfolioUrl":"https://test-student.dev","projects":"InternMatch | Internship matching platform","achievements":"Completed a deployed full-stack project"}')
          test "$update_status" = "200"
          grep -q "Test Student Updated" /tmp/profile-updated.json
          curl --fail --silent --cookie /tmp/student.cookies http://127.0.0.1:8080/api/auth/me | grep -q "CSAI"
          community_status=$(curl --silent --cookie /tmp/student.cookies --output /tmp/community-post.json --write-out "%{http_code}" \
            --request POST http://127.0.0.1:8080/api/community/posts \
            --header "Content-Type: application/json" \
            --data '{"category":"INTERNSHIP_QUESTIONS","title":"CI internship discussion","body":"Has anyone completed a backend internship? What should I prepare?"}')
          test "$community_status" = "201"
          post_id=$(jq -r '.postId' /tmp/community-post.json)
          test "$post_id" != "null"
          grep -q "CI internship discussion" /tmp/community-post.json

          curl --fail --silent --cookie /tmp/student.cookies "http://127.0.0.1:8080/api/community/posts?sort=NEWEST&category=INTERNSHIP_QUESTIONS&q=CI" | tee /tmp/community-feed.json
          jq -e --arg title "CI internship discussion" 'any(.[]; .title == $title)' /tmp/community-feed.json

          vote_status=$(curl --silent --cookie /tmp/student.cookies --output /tmp/community-vote.json --write-out "%{http_code}" \
            --request POST "http://127.0.0.1:8080/api/community/posts/$post_id/upvote")
          test "$vote_status" = "200"
          jq -e '.upvoteCount == 1 and .upvotedByMe == true' /tmp/community-vote.json

          comment_status=$(curl --silent --cookie /tmp/student.cookies --output /tmp/community-comment.json --write-out "%{http_code}" \
            --request POST "http://127.0.0.1:8080/api/community/posts/$post_id/comments" \
            --header "Content-Type: application/json" \
            --data '{"body":"Start with REST APIs, SQL and one deployed project."}')
          test "$comment_status" = "201"
          comment_id=$(jq -r '.commentId' /tmp/community-comment.json)
          test "$comment_id" != "null"
          curl --fail --silent --cookie /tmp/student.cookies "http://127.0.0.1:8080/api/community/posts/$post_id/comments" | jq -e 'length == 1'

          experience_status=$(curl --silent --cookie /tmp/student.cookies --output /tmp/community-experience.json --write-out "%{http_code}" \
            --request POST http://127.0.0.1:8080/api/community/posts \
            --header "Content-Type: application/json" \
            --data '{"category":"EXPERIENCES","title":"My first internship experience","body":"I learned to work with APIs and write clear updates."}')
          test "$experience_status" = "201"

          curl --fail --silent --cookie /tmp/student.cookies "http://127.0.0.1:8080/api/community/students/$student_id" | tee /tmp/community-student-profile.json
          jq -e '.fullName == "Test Student Updated" and .department == "CSAI" and .graduationYear == 2028 and .headline == "CSAI student | Java & React" and .location == "Lucknow, India" and .githubUrl == "https://github.com/test-student" and .projects == "InternMatch | Internship matching platform" and .achievements == "Completed a deployed full-stack project" and .connectionStatus == "SELF" and .discussionCount == 2 and .commentCount == 1 and (.skills | index("Java") != null) and (.experiencePosts | length == 1) and (.recentDiscussions | length == 1) and (has("email") | not)' /tmp/community-student-profile.json

          report_status=$(curl --silent --cookie /tmp/student.cookies --output /tmp/community-report.json --write-out "%{http_code}" \
            --request POST "http://127.0.0.1:8080/api/community/posts/$post_id/report" \
            --header "Content-Type: application/json" \
            --data '{"reason":"OTHER","details":"Testing the report workflow"}')
          test "$report_status" = "200"

          curl --fail --silent --cookie /tmp/student.cookies "http://127.0.0.1:8080/api/admin/reports" | tee /tmp/admin-reports.json
          report_id=$(jq -r '.[0].reportId' /tmp/admin-reports.json)
          test "$report_id" != "null"
          curl --fail --silent --cookie /tmp/student.cookies --request DELETE "http://127.0.0.1:8080/api/admin/reports/$report_id" | grep -q "Report dismissed"

          experience_id=$(jq -r '.postId' /tmp/community-experience.json)
          second_report_status=$(curl --silent --cookie /tmp/student.cookies --output /tmp/community-experience-report.json --write-out "%{http_code}" \
            --request POST "http://127.0.0.1:8080/api/community/posts/$experience_id/report" \
            --header "Content-Type: application/json" \
            --data '{"reason":"OTHER","details":"Testing admin removal"}')
          test "$second_report_status" = "200"

          edit_post_status=$(curl --silent --cookie /tmp/student.cookies --output /tmp/community-edited.json --write-out "%{http_code}" \
            --request PUT "http://127.0.0.1:8080/api/community/posts/$post_id" \
            --header "Content-Type: application/json" \
            --data '{"category":"CAREER_ADVICE","title":"Updated CI internship discussion","body":"Updated post body for the test."}')
          test "$edit_post_status" = "200"
          grep -q "Updated CI internship discussion" /tmp/community-edited.json

          curl --fail --silent --cookie /tmp/student.cookies --request DELETE "http://127.0.0.1:8080/api/community/comments/$comment_id" | grep -q "Comment deleted"
          curl --fail --silent --cookie /tmp/student.cookies --request DELETE "http://127.0.0.1:8080/api/admin/community/posts/$experience_id" | grep -q "Community post removed"
          moderated_post_status=$(curl --silent --cookie /tmp/student.cookies --output /tmp/community-moderated.json --write-out "%{http_code}" "http://127.0.0.1:8080/api/community/posts/$experience_id")
          test "$moderated_post_status" = "404"
          curl --fail --silent --cookie /tmp/student.cookies --request DELETE "http://127.0.0.1:8080/api/community/posts/$post_id" | grep -q "Post deleted"
          deleted_post_status=$(curl --silent --cookie /tmp/student.cookies --output /tmp/community-deleted.json --write-out "%{http_code}" "http://127.0.0.1:8080/api/community/posts/$post_id")
          test "$deleted_post_status" = "404"


      - name: Verify application submission and duplicate protection
        run: |
          student_id=$(jq -r '.studentId' /tmp/registered.json)
          status=$(curl --silent --cookie /tmp/student.cookies --output /tmp/application.json --write-out "%{http_code}" \
            --request POST http://127.0.0.1:8080/api/applications \
            --header "Content-Type: application/json" \
            --data "{\"studentId\":$student_id,\"internshipId\":1}")
          test "$status" = "201"
          grep -q "Backend Developer Intern" /tmp/application.json

          duplicate_status=$(curl --silent --cookie /tmp/student.cookies --output /tmp/duplicate.json --write-out "%{http_code}" \
            --request POST http://127.0.0.1:8080/api/applications \
            --header "Content-Type: application/json" \
            --data "{\"studentId\":$student_id,\"internshipId\":1}")
          test "$duplicate_status" = "409"

          curl --fail --silent --cookie /tmp/student.cookies "http://127.0.0.1:8080/api/students/$student_id/applications" | tee /tmp/applications.json
          grep -q "Backend Developer Intern" /tmp/applications.json

      - name: Verify logout and login
        run: |
          student_id=$(jq -r '.studentId' /tmp/registered.json)
          curl --fail --silent --cookie /tmp/student.cookies --request POST http://127.0.0.1:8080/api/auth/logout >/dev/null
          signed_out_status=$(curl --silent --output /tmp/signed-out.json --write-out "%{http_code}" --cookie /tmp/student.cookies http://127.0.0.1:8080/api/auth/me)
          test "$signed_out_status" = "401"

          community_profile_signed_out_status=$(curl --silent --output /tmp/community-profile-signed-out.json --write-out "%{http_code}" --cookie /tmp/student.cookies "http://127.0.0.1:8080/api/community/students/$student_id")
          test "$community_profile_signed_out_status" = "401"

          login_status=$(curl --silent --cookie-jar /tmp/login.cookies --output /tmp/login.json --write-out "%{http_code}" \
            --request POST http://127.0.0.1:8080/api/auth/login \
            --header "Content-Type: application/json" \
            --data '{"email":"test-student@example.com","password":"StudentPass!234"}')
          test "$login_status" = "200"
          grep -q "Test Student" /tmp/login.json
          curl --fail --silent --cookie /tmp/login.cookies http://127.0.0.1:8080/api/auth/me | grep -q "Test Student"

      - name: Stop Spring Boot process
        if: always()
        run: |
          if [ -f /tmp/internship-api.pid ]; then
            kill "$(cat /tmp/internship-api.pid)" || true
          fi
